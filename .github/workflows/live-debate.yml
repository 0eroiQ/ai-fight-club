name: Run live council debate
on:
  workflow_dispatch:
    inputs:
      mission:
        required: false
        type: string
      resume_run_id:
        required: false
        type: string
      confirm_public:
        required: true
        type: boolean
      confirm_free_settings:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  browser-validation:
    if: >-
      github.repository == '0eroiQ/ai-fight-club'
      && github.ref == 'refs/heads/codex/verify-live-dashboard-bridge'
      && github.actor == '0eroiQ' && inputs.confirm_public && inputs.confirm_free_settings
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare isolated HTTPS browser test
        env:
          VITE_COUNCIL_BRIDGE_ORIGIN: https://bridge.example.test:9443
        run: |
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes -keyout validation/key.pem -out validation/cert.pem -sha256 -days 1 -subj '/CN=bridge.example.test' >/dev/null 2>&1
          npm run build
      - name: Verify real free debate in the HTTPS dashboard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node validation/browser.mjs
      - name: Save verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-browser-proof
          path: bridge-browser-proof.json
          if-no-files-found: error
          retention-days: 7
